<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">AI CYBERVERSE, portfolio of Ayush Yadav</title>
  <desc id="d">Animated banner with a rotating neural network orb and the name Ayush Yadav</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05060f" />
      <stop offset="1" stop-color="#0a0f24" />
    </linearGradient>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="360" y1="0" x2="640" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="tagline" gradientUnits="userSpaceOnUse" x1="72" y1="0" x2="820" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="0.5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#ec4899" />
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .flow { stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    .spin { transform-origin: 960px 160px; animation: spin 40s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .node { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }
  </style>

  <rect width="1200" height="320" fill="url(#bg)" />
  <rect width="1200" height="320" fill="url(#grid)" />
  <circle cx="200" cy="40" r="140" fill="#8b5cf6" opacity="0.35" filter="url(#blur)" />
  <circle cx="1000" cy="260" r="150" fill="#22d3ee" opacity="0.22" filter="url(#blur)" />

  <!-- Neural orb -->
  <g class="spin" filter="url(#glow)">
    <polygon points="1060,160 1031,231 960,260 889,231 860,160 889,89 960,60 1031,89"
             fill="none" stroke="#22d3ee" stroke-opacity="0.35" />
    <polygon points="1003,185 960,210 917,185 917,135 960,110 1003,135"
             fill="none" stroke="#8b5cf6" stroke-opacity="0.55" />
    <path class="flow" fill="none" stroke="#ec4899" stroke-opacity="0.6"
          d="M1060 160 L1003 135 M1060 160 L1003 185 M1031 231 L1003 185 M960 260 L960 210
             M889 231 L917 185 M860 160 L917 185 M860 160 L917 135 M889 89 L917 135
             M960 60 L960 110 M1031 89 L1003 135" />
    <path class="flow" fill="none" stroke="#22d3ee" stroke-opacity="0.5"
          d="M960 160 L1003 185 M960 160 L960 210 M960 160 L917 185
             M960 160 L917 135 M960 160 L960 110 M960 160 L1003 135" />

    <circle class="node" cx="1060" cy="160" r="4" fill="#22d3ee" />
    <circle class="node" style="animation-delay:-0.4s" cx="1031" cy="231" r="4" fill="#ec4899" />
    <circle class="node" style="animation-delay:-0.8s" cx="960" cy="260" r="4" fill="#8b5cf6" />
    <circle class="node" style="animation-delay:-1.2s" cx="889" cy="231" r="4" fill="#22d3ee" />
    <circle class="node" style="animation-delay:-1.6s" cx="860" cy="160" r="4" fill="#ec4899" />
    <circle class="node" style="animation-delay:-2.0s" cx="889" cy="89" r="4" fill="#8b5cf6" />
    <circle class="node" style="animation-delay:-2.4s" cx="960" cy="60" r="4" fill="#22d3ee" />
    <circle class="node" style="animation-delay:-2.8s" cx="1031" cy="89" r="4" fill="#ec4899" />
    <circle class="node" style="animation-delay:-0.3s" cx="1003" cy="185" r="3" fill="#8b5cf6" />
    <circle class="node" style="animation-delay:-0.9s" cx="960" cy="210" r="3" fill="#22d3ee" />
    <circle class="node" style="animation-delay:-1.5s" cx="917" cy="185" r="3" fill="#ec4899" />
    <circle class="node" style="animation-delay:-2.1s" cx="917" cy="135" r="3" fill="#8b5cf6" />
    <circle class="node" style="animation-delay:-2.7s" cx="960" cy="110" r="3" fill="#22d3ee" />
    <circle class="node" style="animation-delay:-0.6s" cx="1003" cy="135" r="3" fill="#ec4899" />
    <circle cx="960" cy="160" r="7" fill="#e8ecff" />
  </g>

  <!-- Text -->
  <text x="72" y="72" class="mono" font-size="14" letter-spacing="4" fill="#22d3ee">&gt; AI CYBERVERSE</text>
  <text x="70" y="150" class="sans" font-size="76" font-weight="800" letter-spacing="2">
    <tspan fill="#e8ecff">AYUSH </tspan><tspan fill="url(#name)">YADAV</tspan>
  </text>
  <text x="72" y="192" class="mono" font-size="19" letter-spacing="3" fill="#9aa4c7">AI DEVELOPER <tspan fill="#22d3ee">|</tspan> ARTIFICIAL INTELLIGENCE <tspan fill="#22d3ee">|</tspan> JAVA &amp; DSA</text>
  <text x="72" y="248" class="sans" font-size="24" font-weight="600" fill="url(#tagline)">BUILDING INTELLIGENCE. AUTOMATING THE IMPOSSIBLE.</text>

  <!-- Bottom scanner line -->
  <rect x="72" y="284" width="1056" height="2" fill="url(#aurora)" opacity="0.8" />
  <rect y="283" width="120" height="4" rx="2" fill="#ffffff" opacity="0.85">
    <animate attributeName="x" from="72" to="1008" dur="3s" repeatCount="indefinite" />
  </rect>
</svg>